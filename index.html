<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #begin {
        position: fixed; inset: 0; z-index: 1; width: 100%; border: 0; padding: 24px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #000; color: #ffb454; font: 14px/1.7 ui-monospace, Consolas, monospace;
        transition: opacity 2.5s ease;
      }
      #begin strong { font-size: 18px; font-weight: normal; letter-spacing: 8px; }
      #begin span { max-width: 46ch; opacity: 0.7; }
      #begin:disabled strong { opacity: 0.35; }
      #begin:focus-visible strong { outline: 1px solid #ffb454; outline-offset: 12px; }
      #begin.gone { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #begin { transition-duration: 0.01s; } }
    </style>
  </head>
  <body>
    <button id="begin" type="button" disabled>
      <strong>CLICK TO BEGIN</strong>
      <span>Double-click in space to set a Heading. Stop brings the Ship to rest. Select a destination, then Warp.</span>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
