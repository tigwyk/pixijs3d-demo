<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .cam { position: absolute; inset: 0; }
      .cam video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1920" data-height="1080">
      <!-- One Warp: a single unbroken take of the Demo (assets/take.mp4), The Scatter to Lantern Station. -->
      <div id="cam" class="cam" data-layout-allow-overflow>
        <video id="journey" class="clip" src="assets/take.mp4" muted playsinline
          data-start="0" data-duration="27" data-media-start="0" data-track-index="0" style="z-index: 1"></video>
      </div>

      <div id="titles" data-composition-id="titles" data-composition-src="compositions/titles.html"
        data-start="0" data-duration="27" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 10"></div>

      <audio id="bed" src="assets/ambient.mp3" data-start="0" data-duration="27" data-track-index="2"
        data-volume="0.7" data-fade-in="1.5" data-fade-out="2.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Open close on the Ship, then pull back so the HUD is in frame before the destination is selected at 6 s.
      tl.fromTo("#cam", { scale: 1.7, transformOrigin: "10% 60%" }, { scale: 1.6, duration: 4.4, ease: "none" }, 0);
      tl.to("#cam", { scale: 1, duration: 1.2, ease: "power3.inOut" }, 4.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
